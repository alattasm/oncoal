<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شاشة الأسعار</title>
<style>
@font-face{font-family:Cairo;src:url(Cairo.ttf)}
@font-face{font-family:Bebas;src:url(Bebas.ttf)}
:root{--bg:#120d0b;--card:#1d1613;--line:#3d2c23;--gold:#f0c060;--gold2:#b8862f;--red:#d3322a;--yel:#ffd23f;--txt:#fff6ec;--mut:#b3a191}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;color:var(--txt);font-family:Cairo,sans-serif}
body{background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(190,60,30,.28),transparent 70%),repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 14px),var(--bg);position:relative;padding:22px 36px}
.frame{position:absolute;inset:12px;border:2px solid rgba(240,192,96,.35);border-radius:22px;pointer-events:none}
.corner{position:absolute;width:70px;height:70px;border:5px solid var(--gold);pointer-events:none}
.corner.tl{top:8px;left:8px;border-right:0;border-bottom:0;border-radius:22px 0 0 0}
.corner.tr{top:8px;right:8px;border-left:0;border-bottom:0;border-radius:0 22px 0 0}
.corner.bl{bottom:8px;left:8px;border-right:0;border-top:0;border-radius:0 0 0 22px}
.corner.br{bottom:8px;right:8px;border-left:0;border-top:0;border-radius:0 0 22px 0}
header{display:flex;align-items:center;justify-content:space-between;height:104px;margin-bottom:14px}
.ribbon{background:linear-gradient(180deg,#e0453a,#a51f18);padding:2px 64px 6px;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%);box-shadow:0 8px 0 #5c0f0b}
.ribbon h1{font-size:52px;font-weight:700;line-height:1.3;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.sect{display:flex;align-items:baseline;gap:16px}
.sect b{font-size:54px;color:var(--gold);font-weight:700}
.sect i{font-style:normal;font-family:Bebas;font-size:44px;letter-spacing:4px;color:var(--mut);direction:ltr}
.seal{width:112px;height:112px;position:relative;display:flex;align-items:center;justify-content:center}
.seal svg{position:absolute;inset:0}
.seal div{position:relative;text-align:center;color:#1a1208;font-weight:700;line-height:1}
.seal b{font-size:28px;display:block}.seal span{font-family:Bebas;font-size:17px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;height:860px}
.grid.r3{grid-template-rows:repeat(3,1fr)}
.grid.r2{grid-template-rows:repeat(2,1fr)}
.grid.r1{grid-template-rows:1fr}
.r1 .nm .ar{font-size:40px}.r1 .nm .e{font-size:22px}.r1 .pr{font-size:76px}.r1 .pr sup{font-size:32px;vertical-align:34px}.r1 .info{padding:10px 24px 22px}
.feat{background-size:cover;background-position:center;justify-content:flex-end;padding:0}
.feat .ov{background:linear-gradient(180deg,rgba(18,13,11,0) 0%,rgba(18,13,11,.92) 55%);padding:120px 26px 30px;text-align:center}
.feat .ov b{display:block;font-size:52px;color:var(--yel);line-height:1.2}
.feat .ov p{font-size:28px;font-weight:700;margin-top:6px}
.feat .ov i{display:block;font-style:normal;font-family:Bebas;font-size:28px;letter-spacing:4px;color:var(--gold);margin-top:10px;direction:ltr}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 26px rgba(0,0,0,.5);display:flex;flex-direction:column}
.ph{flex:1;background-size:cover;background-position:center;position:relative}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(29,22,19,.95) 100%)}
.cat{position:absolute;top:12px;right:0;z-index:2;background:linear-gradient(90deg,var(--gold2),var(--gold));color:#1a1208;font-weight:700;font-size:20px;padding:0 16px 2px 24px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,12px 50%)}
.info{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 18px 10px;margin-top:-34px;position:relative;z-index:2}
.nm .ar{font-size:30px;font-weight:700;line-height:1.15;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.nm .e{font-size:17px;color:var(--mut);direction:ltr;text-align:right;letter-spacing:.5px}
.pr{font-family:Bebas;font-size:58px;line-height:1;direction:ltr;white-space:nowrap;background:#0d0907;border:2px solid var(--gold2);border-radius:12px;padding:4px 12px 0}
.pr sup{font-size:26px;color:var(--gold);vertical-align:24px}
.pr small{font-size:22px;color:var(--mut);margin-left:3px}
.r3 .nm .ar{font-size:27px}.r3 .pr{font-size:50px}
.hot .pr{color:var(--yel);border-color:var(--red);background:#3a0d09}
.burst{position:absolute;z-index:3;top:8px;left:8px;width:118px;height:118px;display:flex;align-items:center;justify-content:center;transform:rotate(-10deg)}
.burst svg{position:absolute;inset:0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.burst span{position:relative;color:#fff;font-weight:700;font-size:28px;line-height:1.05;text-align:center;display:flex;flex-direction:column;align-items:center}
.burst span i{display:block;font-style:normal;font-family:Bebas;font-size:22px;letter-spacing:2px;color:var(--yel);margin-top:2px}
.promo{justify-content:center;align-items:center;text-align:center;background:linear-gradient(135deg,#a51f18,#5c0f0b);border-color:#e0453a;padding:20px}
.promo .t{font-size:40px;font-weight:700;line-height:1.25}
.promo .s{font-family:Bebas;font-size:26px;letter-spacing:4px;color:var(--yel);direction:ltr;margin:6px 0 14px}
.promo .chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.promo .chips span{background:rgba(0,0,0,.3);border:1px solid var(--yel);border-radius:30px;padding:0 14px;font-size:22px;font-weight:700}
footer{position:absolute;bottom:20px;left:44px;right:44px;display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:20px}
footer .mid{color:var(--gold);font-weight:700}
.dots{display:flex;gap:10px;direction:ltr}.dots u{width:12px;height:12px;border-radius:50%;background:#4a382d}.dots u.on{background:var(--gold)}
</style>
</head>
<body>
<div class="frame"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<header>
  <div class="ribbon"><h1>لحوم حلال طازجة يومياً</h1></div>
  <div class="seal"><svg viewBox="0 0 100 100"><polygon id="sealp" fill="#f0c060" stroke="#b8862f" stroke-width="2"/></svg><div><b>حلال</b><span>HALAL</span></div></div>
  <div class="sect" id="sect"></div>
</header>
<main id="main"></main>
<footer><span>الأسعار للرطل · Prices per lb</span><span class="mid">★ نقطّع ونفرم ونجهّز حسب طلبك ★</span><span class="dots" id="dots"></span></footer>
<script>
// ===== عدّل الأسماء والأسعار والصور هنا ===== [عربي, English, السعر, صورة, عرض؟]
const SLIDES=[
 {ar:"غنم وماعز",en:"LAMB & GOAT",rows:2,cols:4,items:[
  ["فخذ ماعز","Goat Leg",15.99,"goatleg"],
  ["لحم غنم قطع","Lamb Cuts",11.99,"lambcuts"],
  ["مكعبات ماعز","Goat Cubes (bone-in)",7.99,"goatcubes"],
  ["موزات غنم","Lamb Shank",7.49,"shank"],
  ["كبدة وكلاوي","Liver · Kidney · Heart",5.99,"liver",0,"مخلفات"],
  ["كرشة","Tripe",6.99,"tripe",0,"مخلفات"],
  ["شحم","Fat",6.99,"fat",0,"مخلفات"],
  ["كوارع","Trotters",2.50,"trotters",0,"مخلفات"],
 ]},
 {ar:"عجل وبقري",en:"VEAL & BEEF",rows:3,cols:4,items:[
  ["ستيك ستربلوين","Striploin Steak",14.49,"striploin",1],
  ["ستيك ريب","Rib Steak",9.99,"rib",1],
  ["روستو بقري","Beef Roast",9.99,"roast",1],
  ["ستيك ريب بالعظم","Bone-in Rib Steak",7.99,"bonerib",1],
  ["ستيك كتف","Blade Steak",9.99,"blade"],
  ["فلانك / صدر","Flank / Brisket",11.99,"brisket"],
  ["روستو فخذ داخلي","Inside Round Roast",10.49,"inround"],
  ["روستو سيرلوين","Sirloin Tip Roast",10.49,"sirtip"],
  ["ستيك سيرلوين","Sirloin Steak",9.99,"sirloin"],
  ["عين الفخذ","Eye of Round",9.99,"eye"],
  ["ستيك سريع القلي","Fast-Fry Steak",9.49,"fastfry"],
  ["لحم مفروم","Ground Beef",6.99,"ground"],
 ]},
 {ar:"دجاج طازج",en:"FRESH CHICKEN",rows:2,cols:3,items:[
  ["دجاج كامل","Whole Chicken",3.59,"whole"],
  ["أرباع دجاج","Leg Quarters",2.79,"quarters"],
  ["أفخاذ دجاج","Chicken Legs",5.49,"legs"],
  ["دبابيس دجاج","Drumsticks",2.99,"drum"],
  ["أجنحة دجاج","Chicken Wings",4.49,"wings",1],
  "PROMO",
 ]},
 {ar:"دجاج متبّل",en:"MARINATED CHICKEN",rows:1,cols:3,items:[
  ["دجاج متبّل بالعظم","Bone-in Marinated",3.99,"marbone_tall",0,"جاهز للشوي 🔥"],
  ["متبّل بدون عظم","Boneless Marinated",8.49,"marcubes_tall",0,"جاهز للشوي 🔥"],
  "FEATURE",
 ]},
];
// =============================================
function star(n,ro,ri){let p=[];for(let i=0;i<n*2;i++){const r=i%2?ri:ro,a=Math.PI*i/n-Math.PI/2;p.push((50+r*Math.cos(a)).toFixed(2)+','+(50+r*Math.sin(a)).toFixed(2))}return p.join(' ')}
document.getElementById('sealp').setAttribute('points',star(24,49,43));
const n=+(new URLSearchParams(location.search).get('s')||1), S=SLIDES[n-1];
document.getElementById('sect').innerHTML=`<b>${S.ar}</b><i>${S.en}</i>`;
document.getElementById('dots').innerHTML=SLIDES.map((_,i)=>`<u class="${i==n-1?'on':''}"></u>`).join('');
const price=p=>{const [d,c]=p.toFixed(2).split('.');return `<sup>$</sup>${d}.${c}<small>/lb</small>`};
const burst=`<div class="burst"><svg viewBox="0 0 100 100"><polygon points="${star(16,50,41)}" fill="#ffd23f"/><polygon points="${star(16,45,37)}" fill="#d3322a"/></svg><span>عرض<i>SALE</i></span></div>`;
document.getElementById('main').innerHTML=`<div class="grid r${S.rows}" style="grid-template-columns:repeat(${S.cols},1fr)">`+S.items.map(it=>{
 if(it==="FEATURE")return `<div class="card feat" style="background:url(items/mardrum_tall.jpg) center/cover"><div class="ov"><b>جاهز للشوي 🔥</b><p>تتبيلات طازجة يومياً<br>اسأل عن الأنواع المتوفرة</p><i>READY TO GRILL</i></div></div>`;
 if(it==="PROMO")return `<div class="card promo"><div class="t">اطلب تقطيعك<br>على كيفك</div><div class="s">CUT · GRIND · MARINATE</div><div class="chips"><span>تقطيع</span><span>فرم</span><span>تتبيل</span><span>تغليف</span></div></div>`;
 const [ar,en,p,img,sale,cat]=it;
 return `<div class="card${sale?' hot':''}"><div class="ph" style="background-image:url(items/${img}.jpg)">${cat?`<div class="cat">${cat}</div>`:''}</div>${sale?burst:''}<div class="info"><div class="nm"><div class="ar">${ar}</div><div class="e">${en}</div></div><div class="pr">${price(p)}</div></div></div>`;
}).join('')+`</div>`;
</script>
</body>
</html>
